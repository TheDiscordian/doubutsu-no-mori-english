name: Validate and deploy website

on:
  push:
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the website package
        env:
          PUBLIC_SITE: ${{ !github.event.repository.private }}
        run: python3 tools/prepare_pages.py --output build/pages --public="$PUBLIC_SITE"
      - name: Test website packaging
        run: python3 -m unittest tests.test_prepare_pages -v
      - name: Test browser patch engine
        run: node --test tests/web_portal.test.mjs
      - name: Preserve the verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    if: github.event.repository.private == false
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
